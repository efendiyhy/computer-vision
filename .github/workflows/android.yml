name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["android-v*"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk EmisiSenseVision-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EmisiSenseVision-debug-apk
          path: android/EmisiSenseVision-debug.apk
          if-no-files-found: error

      - name: Publish release (tag android-v*)
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/EmisiSenseVision-debug.apk
